<!DOCTYPE html>
<html lang="en">
  <head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18496362777"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'AW-18496362777');
  </script>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Netlify form definitions</title>
  </head>
  <body>
    <!--
      Netlify scans this file at build time to register the "contact" form.
      The visible form lives on contact.html; JS POSTs to "/" with the same fields.
    -->
    <form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
    <form name="landing-contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="landing-contact" />
      <input type="hidden" name="to" value="tushar@jewarinternational.com" />
      <input type="hidden" name="source" value="landing-page" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="project_type" />
      <input type="text" name="budget" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
