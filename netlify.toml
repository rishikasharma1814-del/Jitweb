[build]
  publish = "."
  functions = "netlify/functions"

# Pretty URL serves the real file (GET + POST). Avoids 404 when browser is on /contact.
[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/landing-page"
  to = "/landing-page.html"
  status = 200

[[redirects]]
  from = "/landingpage"
  to = "/landing-page.html"
  status = 200

[[redirects]]
  from = "/landing-page/*"
  to = "/landing-page.html"
  status = 200

[[redirects]]
  from = "/landingpage/*"
  to = "/landing-page.html"
  status = 200

[functions]
  node_bundler = "esbuild"
