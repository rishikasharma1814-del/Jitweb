[build]
  publish = "."
  functions = "netlify/functions"

# Pretty URL serves the real file (GET + POST). Avoids 404 when browser is on /contact.
[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/custom-mobile-app-development-company"
  to = "/custom-mobile-app-development-company.html"
  status = 200

[[redirects]]
  from = "/landing-page"
  to = "/custom-mobile-app-development-company.html"
  status = 200

[[redirects]]
  from = "/landingpage"
  to = "/custom-mobile-app-development-company.html"
  status = 200

[[redirects]]
  from = "/landing-page-1"
  to = "/custom-mobile-app-development-company.html"
  status = 200

[[redirects]]
  from = "/landing-page-2"
  to = "/custom-mobile-app-development-company.html"
  status = 200

[[redirects]]
  from = "/landing-page-dark"
  to = "/custom-mobile-app-development-company.html"
  status = 200

[[redirects]]
  from = "/landing-page-3"
  to = "/custom-mobile-app-development-company.html"
  status = 200

[[redirects]]
  from = "/landing-page-split"
  to = "/custom-mobile-app-development-company.html"
  status = 200

[functions]
  node_bundler = "esbuild"
